services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: room_booking
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/room_booking?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-bigPencil}
      DB_MAX_CONNS: ${DB_MAX_CONNS:-20}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
